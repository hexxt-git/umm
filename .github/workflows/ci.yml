name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >=22.18 so `node scripts/*.ts` runs directly (native type stripping);
          # prepare/build:skill/typecheck all execute the .ts scripts unflagged.
          node-version: 22
          cache: npm

      - run: npm ci

      # Prettier and tsc. `typecheck` also embeds the skill (SKILL.md + cli.md
      # -> src/skill.generated.ts), so this catches a broken skill build too.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
