name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prettier and tsc. `typecheck` also embeds the skill (SKILL.md + cli.md
      # -> src/skill.generated.ts), so this catches a broken skill build too.
      - run: npm run format:check
      - run: npm run typecheck
